name: Backend CI

on:
  push:
    paths:
      - "acme_backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "acme_backend/**"
      - ".github/workflows/backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acme_backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: acme_backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          cat > .env.local <<'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=12345
          DB_NAME=acme
          DATABASE_URL=postgresql://postgres:12345@127.0.0.1:5432/acme
          JWT_SECRET=test-jwt-secret-that-is-at-least-thirty-two-characters
          JWT_REFRESH_SECRET=test-refresh-secret-that-is-at-least-thirty-two-characters
          ALLOWED_ORIGIN=http://localhost:3001
          REDIS_URL=redis://127.0.0.1:6379
          EOF
      - run: pnpm db:migrate
      - run: pnpm seed
        env:
          ACME_DEMO_SEED: "1"
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
