name: Full-stack verification

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://audit:acme-ci-only@127.0.0.1:5432/acme
      UPGRADE_DATABASE_URL: postgresql://audit:acme-ci-only@127.0.0.1:5432/acme_upgrade
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: local-ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: local-ci-refresh-secret-at-least-32-characters
      ALLOWED_ORIGIN: http://localhost:3001
      ACME_DEMO_SEED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: acme-ci-only
          POSTGRES_DB: acme
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U audit -d acme" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            acme_backend/pnpm-lock.yaml
            acme_frontend/pnpm-lock.yaml
      - run: pnpm --dir acme_backend install --frozen-lockfile
      - run: pnpm --dir acme_frontend install --frozen-lockfile
      - run: docker exec ${{ job.services.postgres.id }} createdb -U audit acme_upgrade
      - run: pnpm --dir acme_backend test:upgrade
      - run: pnpm --dir acme_backend db:migrate
      - run: pnpm --dir acme_backend seed
      - run: pnpm --dir acme_backend build
      - run: pnpm --dir acme_frontend build
        env:
          NODE_ENV: production
      - run: pnpm --dir acme_frontend exec playwright install --with-deps chromium firefox
      - run: pnpm --dir acme_frontend test:e2e
        env:
          NODE_ENV: production

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example up --build --wait
      - run: curl --fail http://localhost:3000/health/ready && curl --fail --output /dev/null http://localhost:3001/destinations
      - if: always()
        run: docker compose --env-file .env.example down -v
