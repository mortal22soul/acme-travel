x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set the container PostgreSQL URL in .env}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
  ALLOWED_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  migrate:
    build:
      context: ./acme_backend
      target: migrate
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./acme_backend
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build: ./acme_frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    environment:
      API_URL: http://backend:3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-0}
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
